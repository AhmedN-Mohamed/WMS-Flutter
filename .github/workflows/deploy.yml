name: Build Windows Release and Deploy Web

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Windows .exe Release on a Cloud Windows Runner
  # -------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Windows Release (.exe)
        run: flutter build windows --release

      - name: Package Windows Release Archive
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Kanza_WMS_Windows_x64.zip

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kanza-WMS-Windows-Release
          path: Kanza_WMS_Windows_x64.zip
          retention-days: 30

  # -------------------------------------------------------------
  # Job 2: Build and Deploy Web Version to GitHub Pages
  # -------------------------------------------------------------
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web with Base Href
        run: flutter build web --release --base-href "/WMS-Flutter/"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
